name: AWS Real-Time CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Application
        run: |
          python -c "from app import app; client = app.test_client(); assert client.get('/').status_code == 200; assert client.get('/health').status_code == 200"

      - name: CI Pipeline Success
        run: echo "AWS CI-CD Pipeline Completed Successfully!"