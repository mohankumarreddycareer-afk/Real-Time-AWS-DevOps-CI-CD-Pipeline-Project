
name: AWS Real-Time CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Application
        run: |
          python -c "from app import app; client = app.test_client(); assert client.get('/').status_code == 200; assert client.get('/health').status_code == 200"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::439724385629:role/GitHubActions-EC2-ReadOnly
          aws-region: ap-south-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity
